name: Build APK
on:
  push:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Imza anahtarini gizli kasadan hazirla
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/altun.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/altun.keystore" >> "$GITHUB_ENV"
          fi
      - run: gradle assembleDebug --no-daemon -PappVersion=${{ github.event.release.tag_name || '2.0.0.0' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk AltunControl.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AltunControl-APK
          path: AltunControl.apk
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" AltunControl.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
